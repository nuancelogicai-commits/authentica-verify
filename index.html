<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Certificate — Authentica</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0D0D0D;
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .coral-bar {
            width: 100%;
            height: 8px;
            background: #DF7C65;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
            width: 100%;
        }
        
        .header {
            text-align: center;
            margin-bottom: 60px;
        }
        
        .shield {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;
        }
        
        .logo-text {
            font-size: 24px;
            letter-spacing: 3px;
            color: #DF7C65;
            font-weight: 600;
        }
        
        .input-section {
            margin-bottom: 40px;
        }
        
        .input-label {
            display: block;
            margin-bottom: 12px;
            font-size: 16px;
            color: #CCCCCC;
        }
        
        .input-field {
            width: 100%;
            padding: 16px;
            background: #1A1A1A;
            border: 2px solid #333333;
            border-radius: 8px;
            color: #FFFFFF;
            font-size: 18px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: border-color 0.3s;
        }
        
        .input-field:focus {
            outline: none;
            border-color: #DF7C65;
        }
        
        .lookup-button {
            width: 100%;
            padding: 18px;
            background: #DF7C65;
            color: #000000;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        
        .lookup-button:hover {
            opacity: 0.9;
        }
        
        .lookup-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .result-card {
            display: none;
            background: #1A1A1A;
            border-radius: 12px;
            padding: 40px 30px;
            margin-top: 40px;
            text-align: center;
        }
        
        .result-card.show {
            display: block;
        }
        
        .verdict {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 20px;
        }
        
        .verdict.authentic {
            color: #52C478;
        }
        
        .verdict.counterfeit {
            color: #DF7C65;
        }
        
        .confidence {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .category-pill {
            display: inline-block;
            padding: 8px 20px;
            border: 1px solid #555555;
            border-radius: 20px;
            color: #AAAAAA;
            font-size: 16px;
            margin: 20px 0;
        }
        
        .scan-date {
            color: #888888;
            font-size: 14px;
            margin: 15px 0;
        }
        
        .markers {
            color: #AAAAAA;
            font-size: 16px;
            margin: 15px 0;
        }
        
        .verified-badge {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #333333;
            color: #DF7C65;
            font-size: 16px;
            font-weight: 600;
        }
        
        .cert-ref-display {
            color: #666666;
            font-size: 14px;
            margin-top: 10px;
        }
        
        .error-message {
            display: none;
            background: #2A1A1A;
            border: 1px solid #DF7C65;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
            color: #DF7C65;
        }
        
        .error-message.show {
            display: block;
        }
        
        @media (max-width: 640px) {
            .verdict {
                font-size: 36px;
            }
            
            .confidence {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="coral-bar"></div>
    
    <div class="container">
        <div class="header">
            <svg class="shield" viewBox="0 0 100 120" fill="#DF7C65">
                <path d="M50 0 L100 20 L100 60 Q100 100 50 120 Q0 100 0 60 L0 20 Z"/>
            </svg>
            <div class="logo-text">AUTHENTICA</div>
        </div>
        
        <div class="input-section">
            <label class="input-label" for="certInput">Enter Certificate ID</label>
            <input 
                type="text" 
                id="certInput" 
                class="input-field" 
                placeholder="AUTH-XXXXXXXX"
                maxlength="16"
            >
        </div>
        
        <button class="lookup-button" id="lookupBtn">Verify Certificate</button>
        
        <div class="result-card" id="resultCard">
            <div class="verdict" id="verdict"></div>
            <div class="confidence" id="confidence"></div>
            <div class="category-pill" id="category"></div>
            <div class="scan-date" id="scanDate"></div>
            <div class="markers" id="markers"></div>
            <div class="verified-badge">Verified by Authentica</div>
            <div class="cert-ref-display" id="certRefDisplay"></div>
        </div>
        
        <div class="error-message" id="errorMessage">
            Certificate not found. This ID does not match any Authentica scan.
        </div>
    </div>
    
    <script>
        const certInput = document.getElementById('certInput');
        const lookupBtn = document.getElementById('lookupBtn');
        const resultCard = document.getElementById('resultCard');
        const errorMessage = document.getElementById('errorMessage');
        
        certInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.toUpperCase();
        });
        
        lookupBtn.addEventListener('click', async () => {
            const certId = certInput.value.trim();
            
            if (!certId) {
                return;
            }
            
            resultCard.classList.remove('show');
            errorMessage.classList.remove('show');
            lookupBtn.disabled = true;
            lookupBtn.textContent = 'Verifying...';
            
            try {
                const response = await fetch(`https://authenticabackend-production.up.railway.app/verify/${certId}`);
                
                if (!response.ok) {
                    throw new Error('Not found');
                }
                
                const data = await response.json();
                
                // Populate result card
                const verdict = document.getElementById('verdict');
                verdict.textContent = data.verdict;
                verdict.className = 'verdict ' + (data.verdict === 'AUTHENTIC' ? 'authentic' : 'counterfeit');
                
                document.getElementById('confidence').textContent = `${data.confidence}% confidence`;
                document.getElementById('category').textContent = data.category || 'Unknown';
                document.getElementById('scanDate').textContent = `Scanned: ${new Date(data.timestamp).toLocaleDateString()}`;
                document.getElementById('markers').textContent = `${data.markers_checked || 7}/7 markers checked`;
                document.getElementById('certRefDisplay').textContent = certId;
                
                resultCard.classList.add('show');
                
            } catch (error) {
                errorMessage.classList.add('show');
            } finally {
                lookupBtn.disabled = false;
                lookupBtn.textContent = 'Verify Certificate';
            }
        });
        
        certInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                lookupBtn.click();
            }
        });
    </script>
</body>
</html>
