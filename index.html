<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Certificate — Authentica</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 120'><path d='M50 0 L100 20 L100 60 Q100 100 50 120 Q0 100 0 60 L0 20 Z' fill='%23DF7C65'/></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', -apple-system, sans-serif;
            background: #0D0D0D;
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient glow from top */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(ellipse 60% 35% at 50% 0%, rgba(223,124,101,0.07) 0%, transparent 70%);
            z-index: 0;
        }

        .coral-bar {
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #DF7C65, transparent);
            position: relative;
            z-index: 1;
        }

        .container {
            max-width: 520px;
            margin: 0 auto;
            padding: 48px 24px 60px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        /* Shield + header */
        .header {
            text-align: center;
            margin-bottom: 56px;
        }

        .shield-ring {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: radial-gradient(circle at center, rgba(223,124,101,0.13) 0%, transparent 70%);
            border: 2.5px solid #DF7C65;
            box-shadow: 0 0 0 7px rgba(223,124,101,0.05), 0 0 28px rgba(223,124,101,0.18);
            margin-bottom: 20px;
            position: relative;
        }

        .shield-ring::after {
            content: '';
            position: absolute;
            inset: 7px;
            border-radius: 50%;
            border: 1px solid rgba(223,124,101,0.3);
        }

        .shield-emoji {
            font-size: 34px;
            position: relative;
            z-index: 1;
        }

        .logo-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 8px;
            background: linear-gradient(135deg, #DF7C65 0%, #F0C89A 50%, #DF7C65 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
        }

        .logo-sub {
            font-family: 'DM Mono', monospace;
            font-size: 8px;
            letter-spacing: 0.22em;
            color: rgba(223,124,101,0.5);
        }

        /* Divider lines */
        .header-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            margin-top: 14px;
        }

        .header-divider-line {
            flex: 1;
            height: 1px;
            max-width: 60px;
        }

        .header-divider-line-left {
            background: linear-gradient(90deg, transparent, rgba(223,124,101,0.4));
        }

        .header-divider-line-right {
            background: linear-gradient(90deg, rgba(223,124,101,0.4), transparent);
        }

        .header-divider-text {
            font-family: 'DM Mono', monospace;
            font-size: 8px;
            letter-spacing: 0.25em;
            color: rgba(223,124,101,0.45);
            white-space: nowrap;
        }

        /* Input section */
        .input-section {
            margin-bottom: 16px;
        }

        .input-label {
            display: block;
            margin-bottom: 10px;
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.18em;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
        }

        .input-field {
            width: 100%;
            padding: 16px 18px;
            background: #1A1A1A;
            border: 1px solid #333333;
            border-radius: 10px;
            color: #FFFFFF;
            font-family: 'DM Mono', monospace;
            font-size: 17px;
            font-weight: 400;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 4px;
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .input-field::placeholder {
            color: rgba(255,255,255,0.18);
            letter-spacing: 3px;
        }

        .input-field:focus {
            outline: none;
            border-color: #DF7C65;
            box-shadow: 0 0 0 3px rgba(223,124,101,0.1);
        }

        .lookup-button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #DF7C65, #C4613E);
            color: #000000;
            border: none;
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: opacity 0.2s, box-shadow 0.2s;
            box-shadow: 0 6px 24px rgba(223,124,101,0.28);
            margin-top: 12px;
        }

        .lookup-button:hover {
            opacity: 0.9;
            box-shadow: 0 8px 32px rgba(223,124,101,0.38);
        }

        .lookup-button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Result card */
        .result-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(223,124,101,0.15);
            border-radius: 16px;
            padding: 36px 28px;
            margin-top: 28px;
            text-align: center;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.4s ease, transform 0.4s ease;
            pointer-events: none;
            display: none;
        }

        .result-card.show {
            display: block;
            pointer-events: auto;
        }

        .result-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .verdict {
            font-family: 'Cormorant Garamond', serif;
            font-size: 52px;
            font-weight: 700;
            letter-spacing: 6px;
            margin-bottom: 16px;
            line-height: 1;
        }

        .verdict.authentic {
            color: #52C478;
        }

        .verdict.counterfeit {
            color: #DF7C65;
        }

        .confidence {
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px;
            font-weight: 600;
            color: rgba(255,255,255,0.85);
            margin-bottom: 8px;
        }

        .category-pill {
            display: inline-block;
            padding: 6px 18px;
            border: 1px solid #333333;
            border-radius: 20px;
            color: rgba(255,255,255,0.5);
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.14em;
            margin: 16px 0;
            text-transform: uppercase;
        }

        .scan-date {
            color: rgba(255,255,255,0.35);
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.1em;
            margin: 12px 0;
        }

        .markers {
            color: rgba(255,255,255,0.45);
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.1em;
            margin: 12px 0;
        }

        .verified-badge {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #222222;
            color: #DF7C65;
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .cert-ref-display {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 6px;
            padding: 6px 14px;
        }

        .cert-ref-label {
            font-family: 'DM Mono', monospace;
            font-size: 9px;
            letter-spacing: 0.12em;
            color: rgba(255,255,255,0.3);
            text-transform: uppercase;
        }

        .cert-ref-value {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            color: rgba(255,255,255,0.65);
        }

        /* Error */
        .error-message {
            display: none;
            background: rgba(223,124,101,0.06);
            border: 1px solid rgba(223,124,101,0.3);
            border-radius: 10px;
            padding: 18px 20px;
            margin-top: 20px;
            text-align: center;
            color: #DF7C65;
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.1em;
        }

        .error-message.show {
            display: block;
        }

        @media (max-width: 480px) {
            .container {
                padding: 40px 16px 48px;
            }

            .verdict {
                font-size: 40px;
            }

            .confidence {
                font-size: 22px;
            }

            .logo-text {
                font-size: 24px;
                letter-spacing: 6px;
            }
        }

        @media (max-width: 375px) {
            .logo-text { font-size: 20px; letter-spacing: 2px; }
            .verdict { font-size: 32px; }
            .confidence { font-size: 22px; }
            .category-pill { font-size: 14px; padding: 6px 16px; }
            .input-field { font-size: 16px; padding: 14px; }
            .container { padding: 30px 16px; }
        }

        html, body {
            overflow-x: hidden;
        }

        * {
            min-width: 0;
        }
    </style>
</head>
<body>
    <div class="coral-bar"></div>

    <div class="container">
        <div class="header">
            <div class="shield-ring">
                <span class="shield-emoji">🛡️</span>
            </div>
            <div class="logo-text">AUTHENTICA</div>
            <div class="logo-sub">AI AUTHENTICATION ENGINE</div>
            <div class="header-divider">
                <div class="header-divider-line header-divider-line-left"></div>
                <div class="header-divider-text">✦ CERTIFICATE VERIFICATION ✦</div>
                <div class="header-divider-line header-divider-line-right"></div>
            </div>
        </div>

        <div class="input-section">
            <label class="input-label" for="certInput">Certificate ID</label>
            <input
                type="text"
                id="certInput"
                class="input-field"
                placeholder="AUTH-XXXXXXXX"
                maxlength="16"
            >
        </div>

        <button class="lookup-button" id="lookupBtn">Verify Certificate</button>

        <div class="result-card" id="resultCard">
            <div class="verdict" id="verdict"></div>
            <div class="confidence" id="confidence"></div>
            <div class="category-pill" id="category"></div>
            <div class="scan-date" id="scanDate"></div>
            <div class="markers" id="markers"></div>
            <div class="verified-badge">Verified by Authentica</div>
            <div class="cert-ref-display">
                <span class="cert-ref-label">REF</span>
                <span class="cert-ref-value" id="certRefDisplay"></span>
            </div>
        </div>

        <div class="error-message" id="errorMessage">
            Certificate not found. This ID does not match any Authentica scan.
        </div>
    </div>

    <script>
        const certInput = document.getElementById('certInput');
        const lookupBtn = document.getElementById('lookupBtn');
        const resultCard = document.getElementById('resultCard');
        const errorMessage = document.getElementById('errorMessage');

        certInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.toUpperCase();
        });

        lookupBtn.addEventListener('click', async () => {
            if (lookupBtn.dataset.mode === 'reset') {
                certInput.value = '';
                resultCard.classList.remove('visible');
                setTimeout(() => resultCard.classList.remove('show'), 400);
                errorMessage.classList.remove('show');
                lookupBtn.textContent = 'Verify Certificate';
                delete lookupBtn.dataset.mode;
                certInput.focus();
                return;
            }

            const certId = certInput.value.trim();

            if (!certId) {
                return;
            }

            resultCard.classList.remove('visible');
            resultCard.classList.remove('show');
            errorMessage.classList.remove('show');
            lookupBtn.disabled = true;
            lookupBtn.textContent = 'Verifying...';

            try {
                const response = await fetch(`https://authenticabackend-production.up.railway.app/verify/${certId}`);

                if (!response.ok) {
                    throw new Error('Not found');
                }

                const data = await response.json();

                const verdict = document.getElementById('verdict');
                verdict.textContent = data.verdict;
                verdict.className = 'verdict ' + (data.verdict === 'AUTHENTIC' ? 'authentic' : 'counterfeit');

                document.getElementById('confidence').textContent = `${data.confidence}% confidence`;
                document.getElementById('category').textContent = data.category || 'Unknown';
                document.getElementById('scanDate').textContent = `Scanned: ${new Date(data.issued_at).toLocaleDateString()}`;
                document.getElementById('markers').textContent = `${data.markers_checked || 7}/7 markers checked`;
                document.getElementById('certRefDisplay').textContent = certId;

                resultCard.classList.add('show');
                requestAnimationFrame(() => resultCard.classList.add('visible'));
                lookupBtn.textContent = 'Verify Another Certificate';
                lookupBtn.dataset.mode = 'reset';

            } catch (error) {
                errorMessage.classList.add('show');
                lookupBtn.textContent = 'Verify Certificate';
            } finally {
                lookupBtn.disabled = false;
            }
        });

        certInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                lookupBtn.click();
            }
        });
    </script>
</body>
</html>
